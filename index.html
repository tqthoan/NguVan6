<style>
        :root {
            --dark-slate: #f8fafc;
            --primary-amber: #f59e0b;
            --primary-cyan: #22d3ee;
            --primary-emerald: #34d399;
            --bg-color: #020617;
            --base-font-size: 16px;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        html {
            background-color: var(--bg-color);
            min-height: 100vh;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-slate);
            line-height: 1.6;
            margin: 0; padding: 0;
            overflow-x: hidden;
            font-size: var(--base-font-size);
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
            min-height: 100vh;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* ================= CÚ PHÁP ĐỀ TIN HỌC ================= */
        .var-name { color: #facc15; background: rgba(250, 204, 21, 0.15); padding: 0 4px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-weight: bold;}
        .highlight-note { color: #38bdf8 !important; font-weight: 800 !important; font-size: 1.1em;}

        /* ================= GPU EFFECTS ================= */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; overflow: hidden; pointer-events: none;
            background-color: var(--bg-color);
        }
        .aurora-blob {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
            animation: moveAurora 25s infinite alternate ease-in-out;
            will-change: transform; transform: translateZ(0);
        }
        .aurora-1 { background: var(--primary-cyan); width: 50vw; height: 50vh; top: -10%; left: -10%; }
        .aurora-2 { background: #3b82f6; width: 60vw; height: 60vh; top: 40%; right: -20%; }
        .aurora-3 { background: #8b5cf6; width: 40vw; height: 40vh; bottom: -10%; left: 20%; animation-delay: -5s; opacity: 0.1; }
        @keyframes moveAurora { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-2vw, -2vh) scale(1.1); } }

        /* ================= GLASSMORPHISM ================= */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .glass-input {
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
            outline: none;
            background: rgba(15, 23, 42, 0.8);
        }

        .q-wrap {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; transition: all 0.3s;
        }
        .q-wrap:hover { border-color: rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04); }

        /* MULTIPLE CHOICE RADIOS */
        .radio-label {
            background: rgba(2, 6, 23, 0.4); border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8); transition: all 0.2s; cursor: pointer;
        }
        input[type="radio"]:not(:disabled) + .radio-label:hover {
            background: rgba(255, 255, 255, 0.08); color: #fff; border-color: rgba(255, 255, 255, 0.2);
        }
        input[type="radio"]:checked + .radio-label {
            background: rgba(34, 211, 238, 0.15); border-color: var(--primary-cyan);
            color: var(--primary-cyan); text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
            box-shadow: inset 0 0 15px rgba(34, 211, 238, 0.1);
        }

        .test-graded input[type="radio"]:checked + .radio-label { background-color: transparent; border-color: rgba(255,255,255,0.1); color: inherit; text-shadow: none; box-shadow: none;}
